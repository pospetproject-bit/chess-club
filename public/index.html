<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Шахматный Клуб ♟</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
</head>
<body>
<div id="app">

  <!-- ГЛАВНАЯ -->
  <section class="screen" id="screen-home">
    <header class="hero">
      <div class="logo">
        <svg viewBox="0 0 100 100" class="logo-knight"><use href="#knight-logo"/></svg>
        <div>
          <h1>Шахматный Клуб</h1>
          <p class="muted">Играй. Учись. Побеждай.</p>
        </div>
      </div>
      <div id="premium-chip"></div>
    </header>
    <div id="resume-card"></div>
    <div id="daily-card"></div>
    <div class="mode-grid">
      <button class="mode-card" id="btn-bot">
        <span class="mode-ico">🤖</span>
        <span class="mode-title">С ботом</span>
        <span class="mode-sub">3 уровня сложности</span>
      </button>
      <button class="mode-card" id="btn-friend">
        <span class="mode-ico">⚔️</span>
        <span class="mode-title">С другом</span>
        <span class="mode-sub">по ссылке-приглашению</span>
      </button>
      <button class="mode-card" id="btn-local">
        <span class="mode-ico">📱</span>
        <span class="mode-title">Вдвоём рядом</span>
        <span class="mode-sub">на одном устройстве</span>
      </button>
      <button class="mode-card" id="btn-learn-home">
        <span class="mode-ico">🎓</span>
        <span class="mode-title">Обучение</span>
        <span class="mode-sub">интерактивные курсы</span>
      </button>
    </div>
    <div class="card tip-card" id="tip-card"></div>
  </section>

  <!-- ОБУЧЕНИЕ -->
  <section class="screen" id="screen-learn">
    <header class="screen-head"><h2>🎓 Обучение</h2><p class="muted">Интерактивные уроки: читайте и сразу делайте ходы на доске</p></header>
    <div id="learn-list"></div>
  </section>

  <!-- ЗАДАЧИ -->
  <section class="screen" id="screen-puzzles">
    <header class="screen-head"><h2>🧩 Задачи</h2><p class="muted">Тактическое зрение — главный навык растущего игрока</p></header>
    <div id="puzzle-daily"></div>
    <div id="puzzle-list"></div>
  </section>

  <!-- МАГАЗИН -->
  <section class="screen" id="screen-store">
    <header class="screen-head"><h2>⭐ Магазин</h2><p class="muted">Оплата Telegram Stars — прямо внутри Telegram</p></header>
    <div id="store-content"></div>
  </section>

  <!-- ПРОФИЛЬ -->
  <section class="screen" id="screen-profile">
    <header class="screen-head"><h2>👤 Профиль</h2></header>
    <div id="profile-content"></div>
  </section>

  <!-- ИГРОВЫЕ ЭКРАНЫ (динамические) -->
  <section class="screen screen-game" id="screen-game"><div id="game-root"></div></section>
  <section class="screen" id="screen-lesson"><div id="lesson-root"></div></section>
  <section class="screen" id="screen-puzzle"><div id="puzzle-root"></div></section>
  <section class="screen" id="screen-analysis"><div id="analysis-root"></div></section>
  <section class="screen" id="screen-room"><div id="room-root"></div></section>

  <!-- НИЖНЯЯ НАВИГАЦИЯ -->
  <nav id="tabbar">
    <button data-tab="home" class="tab active"><span>♟</span>Играть</button>
    <button data-tab="learn" class="tab"><span>🎓</span>Уроки</button>
    <button data-tab="puzzles" class="tab"><span>🧩</span>Задачи</button>
    <button data-tab="store" class="tab"><span>⭐</span>Магазин</button>
    <button data-tab="profile" class="tab"><span>👤</span>Профиль</button>
  </nav>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<!-- Логотип-конь -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="knight-logo" viewBox="0 0 100 100">
      <path d="M30 84h44v-6c0-3-2-5-5-5h-1c4-8 7-17 7-26 0-16-9-27-22-30l-3-7-4 6-6-2 1 7c-6 4-10 10-12 17l-8 14c-2 3 0 7 3 8l7 2 6-6 4 2c-2 8-7 13-13 16-2 1-3 3-3 5v5z" fill="currentColor"/>
      <circle cx="47" cy="30" r="2.6" fill="#0f1420"/>
    </symbol>
  </defs>
</svg>

<script type="module" src="js/main.js"></script>
</body>
</html>
