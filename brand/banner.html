<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;width:640px;height:360px;overflow:hidden}
  .wrap{position:relative;width:640px;height:360px;background:#0b0e14}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 62%}
  .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,10,16,.94) 0%,rgba(8,10,16,.78) 34%,rgba(8,10,16,.25) 62%,rgba(8,10,16,0) 85%)}
  .txt{position:absolute;left:42px;top:50%;transform:translateY(-50%);color:#e9ecf3}
  .over{font:600 11px/1 "DejaVu Sans",sans-serif;letter-spacing:.34em;color:#d9b36a;text-transform:uppercase;margin-bottom:14px}
  h1{font:700 44px/1.05 "DejaVu Serif",serif;margin:0;color:#f0d9a6;letter-spacing:.01em;text-shadow:0 2px 18px rgba(0,0,0,.6)}
  .rule{width:64px;height:2px;background:linear-gradient(90deg,#d9b36a,rgba(217,179,106,0));margin:16px 0 12px}
  .sub{font:400 15px/1.4 "DejaVu Sans",sans-serif;color:#b9c0cf;letter-spacing:.06em}
</style></head><body>
<div class="wrap">
  <img class="bg" src="banner-bg.png">
  <div class="shade"></div>
  <div class="txt">
    <div class="over">Telegram Mini App</div>
    <h1>Шахматный<br>Клуб</h1>
    <div class="rule"></div>
    <div class="sub">Играй. Учись. Побеждай.</div>
  </div>
</div>
</body></html>
