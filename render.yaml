# Blueprint для Render (альтернатива деплою через API).
# New + → Blueprint → подключить репозиторий → Render создаст сервис сам.
services:
  - type: web
    name: chess-club
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_URL   # Neon Postgres (необязательно, но рекомендуется)
        sync: false
      - key: BOT_TOKEN      # токен от @BotFather
        sync: false
      - key: WEBAPP_URL     # https-адрес этого сервиса, напр. https://chess-club.onrender.com
        sync: false
      - key: APP_SHORT_NAME # short name из BotFather /newapp
        value: play
      - key: SUPPORT_USERNAME
        sync: false
      - key: ADSGRAM_INTERSTITIAL_ID
        sync: false
      - key: ADSGRAM_REWARDED_ID
        sync: false
