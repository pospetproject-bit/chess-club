name: Keep chess club awake

# Бесплатный Render засыпает через 15 минут без запросов — и вместе с ним
# засыпает бот. Пингуем /healthz каждые 10 минут, чтобы игроки никогда
# не видели заставку «Service waking up». Каждые 5 минут (со сдвигом от начала часа,
# когда у GitHub пик нагрузки) — запас прочности, если запуск задержится.
on:
  schedule:
    - cron: '1-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Будим клуб и проверяем здоровье
        run: |
          url="https://chess-club-1sph.onrender.com/healthz"
          for i in $(seq 1 10); do
            body=$(curl -s --max-time 45 "$url" || true)
            if [ "$body" = "ok" ]; then
              echo "клуб бодрствует (попытка $i)"
              exit 0
            fi
            echo "попытка $i: сервис ещё просыпается…"
            sleep 8
          done
          echo "::warning::клуб не ответил ok за 10 попыток"
          exit 1

      # GitHub отключает расписания, если в репозитории 60 дней нет коммитов.
      # Раз в месяц оставляем отметку, чтобы будильник не выключился сам.
      - id: day
        run: echo "d=$(date -u +%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.day.outputs.d == '01' || github.event_name == 'workflow_dispatch'

      - name: Ежемесячная отметка активности
        if: steps.day.outputs.d == '01' || github.event_name == 'workflow_dispatch'
        run: |
          stamp=$(date -u +%Y-%m)
          if grep -q "$stamp" deploy/heartbeat.txt 2>/dev/null; then
            echo "отметка за $stamp уже есть"
            exit 0
          fi
          echo "$stamp — будильник работает" >> deploy/heartbeat.txt
          git config user.name "chess-club-keeper"
          git config user.email "actions@github.com"
          git add deploy/heartbeat.txt
          git commit -m "chore: keep-awake heartbeat $stamp"
          git push
